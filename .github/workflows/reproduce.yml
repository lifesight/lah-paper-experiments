name: Reproduce current LAH component results
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify frozen archive, reanalyze stored results, replay one cell
        run: python reproduce.py --output "$RUNNER_TEMP/lah-verification"
      - name: Check historical preservation and result mirrors
        run: python scripts/check_repository.py
